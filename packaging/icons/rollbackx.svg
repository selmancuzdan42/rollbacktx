<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0f1115"/>

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="190" stroke="#10b981" stroke-width="8" stroke-opacity=".12"/>

  <!-- Rollback circular arrow -->
  <path d="M 340 130
           A 140 140 0 1 0 370 274"
        stroke="#10b981" stroke-width="30" stroke-linecap="round"/>

  <!-- Arrow head -->
  <polygon points="370,232 370,316 420,274" fill="#10b981"/>

  <!-- Center: drive/shield icon -->
  <rect x="200" y="200" width="112" height="132" rx="16" fill="#10b981" fill-opacity=".1" stroke="#10b981" stroke-width="6"/>

  <!-- Drive detail lines -->
  <line x1="224" y1="286" x2="288" y2="286" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-opacity=".6"/>
  <circle cx="276" cy="306" r="5" fill="#10b981" fill-opacity=".6"/>
  <circle cx="258" cy="306" r="5" fill="#10b981" fill-opacity=".6"/>

  <!-- Checkmark -->
  <polyline points="228,244 250,266 286,222" stroke="#34d399" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
