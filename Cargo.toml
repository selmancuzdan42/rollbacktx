[workspace]
members = [
    "crates/rollbackx-core",
    "crates/rollbackx-cli",
    "crates/rollbackx-gtk",
    "tests",
]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
authors = ["Selman F. CÜZDAN"]
license = "GPL-3.0"

[workspace.dependencies]
thiserror  = "1"
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
chrono     = { version = "0.4", features = ["serde", "clock"] }
clap       = { version = "4", features = ["derive", "color"] }
colored    = "2"
tabled     = "0.15"
tempfile   = "3"
